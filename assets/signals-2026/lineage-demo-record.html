<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Material record · Lineage demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f7;color:#343c40;font:14px/1.6 Arial,sans-serif}header{padding:16px 28px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:20px}header a{color:#1c68b1;text-decoration:none}header small{color:#7b8489}main{background:white;max-width:1200px;margin:32px auto;padding:32px;border:1px solid #dce0df;border-radius:4px}h1{font-size:25px;color:#346479;font-weight:500;margin:0 0 20px}.record-tabs{display:flex;gap:28px;border-bottom:1px solid #ddd;margin-bottom:26px;color:#6d7478}.record-tabs span{padding:9px 0}.record-tabs .active{color:#1768ce;border-bottom:2px solid #1768ce;font-weight:600}h2{font-size:17px;font-weight:500;margin-top:32px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:12px;text-align:left}th{font-weight:500;background:#f8f9f9;width:220px}td a{color:#1768ce;text-decoration:none}.relations{display:grid;grid-template-columns:1fr 1fr;gap:30px}.relations a{display:block;padding:12px;border:1px solid #ddd;margin:8px 0;color:#1768ce;text-decoration:none}.relations small{display:block;color:#777}.relations p{color:#888}.back{display:inline-block;color:#1768ce;text-decoration:none;margin-top:28px}@media(max-width:650px){header{padding:14px 18px}main{margin:16px;padding:20px}.relations{grid-template-columns:1fr;gap:0}th{width:35%}.record-tabs{gap:20px}h1{font-size:22px}}
</style></head><body><header><a id="case-link" href="/signals-lineage#lineage-live-demo">Material Lineage</a><small id="demo-label"></small></header><main id="record"></main><script type="module">
import {findNode,recordRelations} from './lineage-graph-model.mjs';
const params=new URLSearchParams(location.search),cn=params.get('lang')==='zh',i=cn?0:1,t=(zh,en)=>cn?zh:en;
document.documentElement.lang=cn?'zh-CN':'en';document.getElementById('case-link').href='/signals-lineage?lang='+(cn?'zh':'en')+'#lineage-live-demo';document.getElementById('demo-label').textContent=t('交互演示 · 示例记录','Interactive demo · Example record');
const node=findNode(params.get('node'));const main=document.getElementById('record');
if(!node){const p=document.createElement('p');p.textContent=t('未找到这条示例记录','Example record not found');main.append(p);}else{
 document.title=node.id+' · '+t('材料详情演示','Material record demo');
 const heading=document.createElement('h1');heading.textContent=node.library[i]+' · '+node.id;main.append(heading);
 const tabs=document.createElement('div');tabs.className='record-tabs';[t('材料','Material'),t('批次','Batch/Lot')].forEach((text,index)=>{const span=document.createElement('span');span.textContent=text;if(index===(node.type==='batch'?1:0))span.className='active';tabs.append(span);});main.append(tabs);
 const table=document.createElement('table');const fields=[[t('材料编号','Material ID'),node.id],[t('材料名称','Material Name'),node.name[i]],[t('材料类型','Material Type'),node.library[i]],[t('材料／批次','Asset/Batch'),node.type==='batch'?t('批次','Batch/Lot'):t('材料','Asset')]];
 fields.forEach(([key,value])=>{const row=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.scope='row';th.textContent=key;td.textContent=value;row.append(th,td);table.append(row);});main.append(table);
 const rel=recordRelations(node.id),layout=document.createElement('div');layout.className='relations';
 [['parents',t('亲代记录','Parent records')],['children',t('子代记录','Child records')]].forEach(([key,title])=>{const section=document.createElement('section'),h=document.createElement('h2');h.textContent=title;section.append(h);rel[key].forEach(n=>{const a=document.createElement('a');a.href='?node='+encodeURIComponent(n.id)+'&lang='+(cn?'zh':'en');a.textContent=n.id;const small=document.createElement('small');small.textContent=n.name[i];a.append(small);section.append(a);});if(!rel[key].length){const empty=document.createElement('p');empty.textContent=t('无关联记录','No related records');section.append(empty);}layout.append(section);});main.append(layout);
 const back=document.createElement('a');back.className='back';back.href='/signals-lineage?lang='+(cn?'zh':'en')+'#lineage-live-demo';back.textContent=t('返回作品集中的图谱演示','Back to the portfolio demo');main.append(back);
}
</script></body></html>
